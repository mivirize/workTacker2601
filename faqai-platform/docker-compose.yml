version: '3.9'

services:
  # ─────────────────────────────────────
  # PostgreSQL 16 + pgvector
  # ─────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: faqai-postgres
    environment:
      POSTGRES_DB: faqai_dev
      POSTGRES_USER: faqai
      POSTGRES_PASSWORD: faqai_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faqai -d faqai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: faqai-redis
    command: redis-server --requirepass redis_secret --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────
  # MinIO (S3互換ストレージ)
  # ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: faqai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────
  # BullMQ Board (キュー監視UI)
  # ─────────────────────────────────────
  bullboard:
    image: deadly0/bull-board:latest
    container_name: faqai-bullboard
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secret
    ports:
      - "3010:3000"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
    name: faqai_postgres_data
  redis_data:
    name: faqai_redis_data
  minio_data:
    name: faqai_minio_data

networks:
  default:
    name: faqai-network
    driver: bridge
