<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A4A73;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" rx="16" fill="url(#heroGrad)"/>

  <!-- Video call mockup -->
  <rect x="50" y="50" width="400" height="250" rx="12" fill="#fff" opacity="0.95"/>

  <!-- Main speaker (teacher) -->
  <rect x="70" y="70" width="220" height="160" rx="8" fill="#E5E7EB"/>
  <circle cx="180" cy="130" r="40" fill="#FF6B35"/>
  <text x="180" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white">T</text>
  <rect x="70" y="200" width="220" height="25" rx="4" fill="#1E3A5F"/>
  <text x="180" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Native Teacher - Sarah</text>

  <!-- Small video (student) -->
  <rect x="310" y="70" width="120" height="85" rx="6" fill="#E5E7EB"/>
  <circle cx="370" cy="100" r="20" fill="#1E3A5F"/>
  <text x="370" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">S</text>

  <!-- Controls -->
  <rect x="150" y="265" width="200" height="20" rx="10" fill="#E5E7EB"/>

  <!-- Decorative elements -->
  <circle cx="420" cy="350" r="30" fill="#FF6B35" opacity="0.3"/>
  <circle cx="80" cy="340" r="20" fill="#1E3A5F" opacity="0.2"/>
</svg>
