<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="16" fill="url(#solGrad)"/>

  <!-- Laptop mockup -->
  <rect x="60" y="60" width="360" height="220" rx="12" fill="#1E3A5F"/>
  <rect x="75" y="75" width="330" height="190" rx="4" fill="#fff"/>

  <!-- Screen content - lesson interface -->
  <rect x="85" y="85" width="150" height="110" rx="4" fill="#E5E7EB"/>
  <circle cx="160" cy="125" r="25" fill="#FF6B35"/>
  <text x="160" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">NT</text>
  <text x="160" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Live Lesson</text>

  <!-- Chat/material area -->
  <rect x="245" y="85" width="160" height="170" rx="4" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="255" y="95" width="100" height="12" rx="2" fill="#1E3A5F"/>
  <rect x="255" y="115" width="140" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="255" y="130" width="120" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="255" y="145" width="130" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="255" y="170" width="140" height="30" rx="4" fill="#FF6B35" opacity="0.2"/>
  <rect x="255" y="210" width="100" height="35" rx="4" fill="#10B981" opacity="0.3"/>

  <!-- Progress bar -->
  <rect x="85" y="210" width="150" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="85" y="210" width="90" height="8" rx="4" fill="#10B981"/>

  <!-- Level indicator -->
  <rect x="85" y="230" width="60" height="20" rx="4" fill="#1E3A5F"/>
  <text x="115" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Level 3</text>

  <!-- Laptop base -->
  <rect x="40" y="280" width="400" height="15" rx="2" fill="#1E3A5F"/>
  <rect x="180" y="295" width="120" height="8" rx="2" fill="#152C4A"/>

  <!-- Decorative -->
  <circle cx="440" cy="320" r="25" fill="#FF6B35" opacity="0.2"/>
  <circle cx="40" cy="40" r="15" fill="#1E3A5F" opacity="0.1"/>
</svg>
